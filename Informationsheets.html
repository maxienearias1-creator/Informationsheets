<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Attendance Check-In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 5px; color: #111; }
        p { color: #555; margin-bottom: 25px; }
        .qr-box {
            padding: 20px;
            border: 2px dashed #0066cc;
            display: inline-block;
            border-radius: 8px;
            background: #fafafa;
        }
        .qr-box img {
            width: 220px;
            height: 220px;
            display: block;
            margin: auto;
            object-fit: contain;
        }
        .instructions {
            margin-top: 25px;
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }
        .instructions ol {
            text-align: left;
            display: inline-block;
            margin: auto;
        }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Organization Check-In</h1>
        <p>Scan to fill out the attendance information form</p>

        <div class="qr-box">
            <!-- Points to Image.png uploaded in your GitHub repository -->
            <img src="Image.png" alt="https://docs.google.com/forms/d/e/1FAIpQLSdOz8BN1tiqOR7IBF5nSDYXTkPkLc07U5NSLJrxuhQMBF2IQg/viewform">
        </div>

        <div class="instructions">
            <strong>How to submit attendance:</strong>
            <ol>
                <li>Open your smartphone's standard <strong>Camera app</strong>.</li>
                <li>Point it at the QR code above.</li>
                <li>Tap the link pop-up to open the Google Form and submit your information.</li>
            </ol>
        </div>
    </div>

</body>
</html>
